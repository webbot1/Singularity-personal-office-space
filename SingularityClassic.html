// ==================== полифиллы ES3 ====================
if(!Array.prototype.indexOf){Array.prototype.indexOf=function(v){for(var i=0;i<this.length;i++){if(this[i]===v)return i;}return -1;};}
if(!Array.prototype.map){Array.prototype.map=function(f){var r=[];for(var i=0;i<this.length;i++)r.push(f(this[i],i));return r;};}
if(!Array.prototype.filter){Array.prototype.filter=function(f){var r=[];for(var i=0;i<this.length;i++)if(f(this[i],i))r.push(this[i]);return r;};}
if(!Array.prototype.forEach){Array.prototype.forEach=function(f){for(var i=0;i<this.length;i++)f(this[i],i);};}
if(!String.prototype.trim){String.prototype.trim=function(){return this.replace(/^[ \t\n\r]+|[ \t\n\r]+$/g,'');};}

// ==================== сериализация (свой JSON для ES3) ====================
function jstr(s){
  s=String(s);
  return '"'+s.replace(/[\\\u0000-\u001f"]/g,function(c0){
    var cc=c0.charCodeAt(0);
    if(cc===34)return '\\"';
    if(cc===92)return '\\\\';
    if(cc===10)return '\\n';
    if(cc===13)return '\\r';
    if(cc===9)return '\\t';
    return '\\u'+('000'+cc.toString(16)).slice(-4);
  })+'"';
}
function jout(v){
  if(v===null||v===undefined)return 'null';
  if(typeof JSON!=='undefined'&&JSON.stringify)return JSON.stringify(v);
  var t=typeof v;
  if(t=='number')return isFinite(v)?String(v):'null';
  if(t=='boolean')return String(v);
  if(t=='string')return jstr(v);
  if(v instanceof Array){
    var a=[];
    for(var i=0;i<v.length;i++)a.push(jout(v[i]));
    return '['+a.join(',')+']';
  }
  var o=[];
  for(var k in v)if(v.hasOwnProperty(k))o.push(jstr(k)+':'+jout(v[k]));
  return '{'+o.join(',')+'}';
}
function jparse(s){
  if(typeof JSON!=='undefined'&&JSON.parse){try{return JSON.parse(s);}catch(e){return null;}}
  var i=0;
  function ws(){while(i<s.length&&' \t\n\r'.indexOf(s.charAt(i))>=0)i++;}
  function val(){
    ws();var c=s.charAt(i);
    if(c=='"'){
      i++;var r='';
      while(i<s.length&&s.charAt(i)!=='"'){
        if(s.charAt(i)=='\\'){
          i++;var e=s.charAt(i);
          if(e=='n')r+='\n';
          else if(e=='t')r+='\t';
          else if(e=='r')r+='\r';
          else if(e=='u'){r+=String.fromCharCode(parseInt(s.substr(i+1,4),16));i+=4;}
          else r+=e;
          i++;
        }else{r+=s.charAt(i);i++;}
      }
      i++;return r;
    }
    if(c=='['){
      i++;var a=[];ws();
      if(s.charAt(i)==']'){i++;return a;}
      while(true){a.push(val());ws();if(s.charAt(i)==',')i++;else{i++;break;}}
      return a;
    }
    if(c=='{'){
      i++;var o={};ws();
      if(s.charAt(i)=='}'){i++;return o;}
      while(true){
        ws();var k=val();ws();i++;o[k]=val();ws();
        if(s.charAt(i)==',')i++;else{i++;break;}
      }
      return o;
    }
    if(s.substr(i,4)=='true'){i+=4;return true;}
    if(s.substr(i,5)=='false'){i+=5;return false;}
    if(s.substr(i,4)=='null'){i+=4;return null;}
    var st=i;
    while(i<s.length&&'-0123456789.eE+'.indexOf(s.charAt(i))>=0)i++;
    return parseFloat(s.substr(st,i-st));
  }
  return val();
}

// ==================== ремонтный JSON-парсер (восстановление сломанных копий) ====================
function jparseFix(s){
  var n=s.length,i=0,jr=[],sk={};
  function run(){
    i=0;jr=[];
    function ws(){while(i<n&&' \t\n\r'.indexOf(s.charAt(i))>=0)i++;}
    function val(){
      ws();if(i>=n)throw 'eof';
      var c=s.charAt(i);
      if(c=='"'){
        i++;var r='';
        while(true){
          if(i>=n)throw 'unterm';
          var ch=s.charAt(i);
          if(ch=='\\'){
            if(i+1>=n)throw 'esc';
            i++;var e=s.charAt(i);i++;
            if(e=='n')r+='\n';else if(e=='t')r+='\t';else if(e=='r')r+='\r';
            else if(e=='u'){r+=String.fromCharCode(parseInt(s.substr(i,4),16));i+=4;}
            else r+=e;
            continue;
          }
          if(ch=='"'){
            if(sk[i]){r+='"';i++;continue;}
            var j=i+1;while(j<n&&' \t\n\r'.indexOf(s.charAt(j))>=0)j++;
            var f=(j<n)?s.charAt(j):'\u0000';
            if(f==','||f==']'||f=='}'||f==':'||f=='\u0000'){jr.push([i,f]);i++;return r;}
            r+='"';i++;continue;
          }
          r+=ch;i++;
        }
      }
      if(c=='['){
        i++;var a=[];ws();
        if(i<n&&s.charAt(i)==']'){i++;return a;}
        while(true){a.push(val());ws();if(i>=n)throw 'unarr';
          if(s.charAt(i)==',')i++;
          else{if(s.charAt(i)!=']')throw 'arr';i++;return a;}}
      }
      if(c=='{'){
        i++;var o={};ws();
        if(i<n&&s.charAt(i)=='}'){i++;return o;}
        while(true){
          ws();var k=val();ws();
          if(i>=n||s.charAt(i)!=':')throw 'colon';
          i++;o[k]=val();ws();
          if(i>=n)throw 'unobj';
          if(s.charAt(i)==',')i++;
          else{if(s.charAt(i)!='}')throw 'obj';i++;return o;}}
      }
      if(s.substr(i,4)=='true'){i+=4;return true;}
      if(s.substr(i,5)=='false'){i+=5;return false;}
      if(s.substr(i,4)=='null'){i+=4;return null;}
      var t0=i;
      while(i<n&&'-0123456789.eE+'.indexOf(s.charAt(i))>=0)i++;
      if(t0==i)throw 'ch';
      return parseFloat(s.substr(t0,i-t0));
    }
    var v=val();ws();
    if(i!=n)throw 'tail';
    return v;
  }
  for(var a=0;a<60;a++){
    var v=null;
    try{v=run();}catch(e){v=null;}
    if(v&&typeof v=='object'&&!v.length&&v.v===1&&(v.notes instanceof Array)&&(v.tables instanceof Array))return v;
    var cand=-1;
    for(var q=0;q<jr.length;q++){
      var p=jr[q][0],f=jr[q][1];
      if((f==','||f==']'||f=='}'||f=='\u0000')&&!sk[p]&&p>cand)cand=p;
    }
    if(cand<0)return null;
    sk[cand]=1;
  }
  return null;
}

// ==================== хранилище: userData (IE5+) с фолбэком на cookie ====================
var _udN=0;
function storeSave(s){
  try{if(window.localStorage){localStorage.setItem('nbfData',s);return true;}}catch(e0){}
  var el=document.getElementById('store');
  try{
    if(el&&el.addBehavior){
      var CH=20000,N=Math.ceil(s.length/CH),i;
      if(N>80)N=80;
      for(i=0;i<N;i++){el.setAttribute('v',s.substr(i*CH,CH));el.save('nbfS'+i);}
      for(i=N;i<_udN;i++){el.setAttribute('v','');el.save('nbfS'+i);}
      _udN=N;
      el.setAttribute('meta',''+N);
      el.save('nbfMeta');
      return true;
    }
  }catch(e){}
  try{
    document.cookie='nbfData=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';
    var N2=Math.ceil(s.length/3600);
    if(N2>24)return false;
    for(var i2=0;i2<N2;i2++)document.cookie='nbfData'+i2+'='+encodeURIComponent(s.substr(i2*3600,3600))+';path=/;expires=Thu, 31 Dec 2099 23:59:59 GMT';
    return true;
  }catch(e2){}
  return false;
}
function storeLoad(){
  try{if(window.localStorage){var v0=localStorage.getItem('nbfData');if(v0)return v0;}}catch(e0){}
  var el=document.getElementById('store');
  try{
    if(el&&el.addBehavior){
      el.load('nbfMeta');
      var meta=el.getAttribute('meta');
      if(meta!=null&&meta.length){
        var N=parseInt(meta,10);
        if(N>0&&N<=80){
          var i,part,s='';
          for(i=0;i<N;i++){
            el.load('nbfS'+i);
            part=el.getAttribute('v');
            if(part==null)return '';
            s+=part;
          }
          if(s)return s;
        }
      }
    }
  }catch(e){}
  try{
    var m=document.cookie.match(/(?:^|; )nbfData=([^;]*)/);
    if(m)return decodeURIComponent(m[1]);
    var N=0;
    while(document.cookie.match(new RegExp('(?:^|; )nbfData'+N+'=')))N++;
    if(N>0&&N<=24){
      var s2='';
      for(var i2=0;i2<N;i2++){
        var mm=document.cookie.match(new RegExp('(?:^|; )nbfData'+i2+'=([^;]*)'));
        if(!mm)return '';
        s2+=decodeURIComponent(mm[1]);
      }
      return s2;
    }
  }catch(e2){}
  return '';
}

var state=null,cur=0,curNote=null,curTable=null,_leaves=[],csvBuf=null,saveRows=null,_meas=[],noteQ='',tableQ='',srcQ='',schemaQ='',expQ='',schQa='',schQb='',unQ='',starQ='',xQ='';

var _saveErr=0;
function saveState(){
  if(_saveT)return;
  _saveT=setTimeout(function(){
    _saveT=null;
    var ok=false;
    try{ok=storeSave(jout(state));}catch(e){ok=false;}
    if(!ok){if(_saveErr==0){_saveErr=1;stat(tr('ВНИМАНИЕ: не удалось сохранить данные автоматически — сделайте резервную копию в разделе «Данные».'));}}

function flushSave(){

// ==================== утилиты ====================
function esc(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stat(t){document.getElementById('statusbar').innerHTML=tr(' '+esc(t));}
function fmt(n){
  if(typeof n!='number')return String(n);
  if(isNaN(n)||!isFinite(n))return '\u2014';
  if(Math.abs(n-Math.round(n))<1e-9)return String(Math.round(n)).replace(/(\d)(?=(\d{3})+(?!\d))/g,'$1 ');
  return String(Math.round(n*100)/100);
}
function toNum(v){
  var s=String(v==null?'':v);

  var f=parseFloat(t0);
  if(isNaN(f))f=0;
  _numCache[s]=f;
  return f;
}

var TRIZEN=[['Divide and conquer','Split the object into independent parts; make the parts removable; increase the degree of fragmentation'],
['Taking out','Separate the interfering property or function; single out the needed property into a separate element'],
['Local quality','Give each part of the object its own conditions; let every part work in its best mode'],
['Asymmetry','Replace symmetry with asymmetry; amplify the existing asymmetry'],
['Merging','Combine similar or adjacent objects; merge operations in time'],
['Universality','One object does several different jobs; other objects become unnecessary'],
['Nested doll','One object is placed inside another, inside that — the next one'],
['Anti-weight','Compensate the weight of the object: join it with another having lifting power, or use aerodynamics'],
['Preliminary anti-action','Preliminary stress in advance to oppose the working stress'],
['Preliminary action','Perform the needed action in advance, fully or at least partially'],
['Cushion in advance','Prepare emergency measures and compensations in advance against a mishap'],
['Equipotentiality','Change working conditions so the object does not have to be raised or lowered'],
['The other way around','Do it the other way around; make the immovable movable; turn the object inside out'],
['Spheroidality','Go from straight lines to curves, from cubes to spheres; use rollers and balls'],
['Dynamics','Change the characteristics of the object at each stage of work; split it into movable parts'],
['Partial or excessive actions','Do it not 100%, but a bit less or a bit more — the task will get simpler'],
['Another dimension','Move to a multi-layer structure; tilt or rotate the object; use the reverse side'],
['Mechanical vibration','Make the object vibrate; raise the frequency; use resonance'],
['Periodic action','Replace a continuous action with a periodic one; use pauses for another action'],
['Continuity of useful action','Carry out the work without interruptions; eliminate idle running'],
['Rush through','Carry out the process at high speed, "on the fly"'],
['Blessing in disguise','Use the harmful action for good; intensify the harm to a non-dangerous level; add a second harm and neutralize them'],
['Feedback','Introduce feedback; if it exists — change it'],
['Mediator','Use an intermediate object that can later be easily removed or changed'],
['Self-service','The object serves itself; the object itself performs the auxiliary work'],
['Copying','Replace an unavailable or expensive object with its copy; move to optical copies and scales'],
['Cheap short-living objects','Replace an expensive durable object with a cheap short-living one'],

// ==================== WHERE-фильтры строк (мини-условия) ====================
function wcIsNum(v){var s=String(v==null?'':v).replace(/^\s+|\s+$/g,'');if(!s)return false;if(!/^[-+]?[0-9]*\.?[0-9]+$/.test(s))return false;return isFinite(parseFloat(s));}
function wcLike(pat,s){
  var p=lc(String(pat==null?'':pat)),v=lc(String(s==null?'':s));
  var seg=p.split('%'),pos=0;
  for(var i=0;i<seg.length;i++){
    var g=seg[i];if(g==='')continue;
    var idx=v.indexOf(g,pos);
    if(idx<0)return false;
    if(i===0&&idx!==0)return false;
    pos=idx+g.length;
  }
  if(seg[seg.length-1]!==''&&pos<v.length)return false;
  return true;
}
function wcParse(s){
  var out={c:[],err:0};
  if(!s||!String(s).replace(/\s/g,''))return out;
  var parts=String(s).split(/\s+(?:AND|И)\s+/i);
  for(var i=0;i<parts.length;i++){
    var t0=parts[i],p=0,col='',op='',val='';
    while(p<t0.length&&(t0.charAt(p)==' '||t0.charAt(p)=='\t'))p++;
    var q=t0.charAt(p);
    if(q=='"'||q=="'"){var e1=t0.indexOf(q,p+1);if(e1<0){out.err=1;break;}col=t0.substring(p+1,e1);p=e1+1;}
    else{var st=p;while(p<t0.length&&' <>=!'.indexOf(t0.charAt(p))<0)p++;col=t0.substring(st,p);}
    var rest=t0.substring(p).replace(/^\s+/,'');
    var m=rest.match(/^(NOT\s+LIKE|LIKE|<>|!=|<=|>=|=|<|>)/i);
    if(!m){out.err=1;break;}
    op=m[1];val=rest.substring(m[1].length).replace(/^\s+/,'').replace(/\s+$/,'');
    if(val.length>=2){var q0=val.charAt(0),qe=val.charAt(val.length-1);if((q0=='"'&&qe=='"')||(q0=="'"&&qe=="'"))val=val.substring(1,val.length-1);}
    var ol=op.toLowerCase();
    if(ol=='not like')out.c.push({col:col,op:'LIKE',val:val,like:1,not:1});
    else if(ol=='like')out.c.push({col:col,op:'LIKE',val:val,like:1,not:0});
    else out.c.push({col:col,op:op,val:val,like:0,not:0});
  }
  if(out.err)out.c=[];
  return out;
}
function wcMatch(row,cols,c){
  if(!c||!c.length)return true;
  for(var i=0;i<c.length;i++){
    var e=c[i],ci=-1;
    for(var j=0;j<cols.length;j++)if(cols[j]==e.col){ci=j;break;}
    if(ci<0)return false;
    var v=row[ci]==null?'':row[ci];
    if(e.like){var hit=wcLike(e.val,v);if(e.not?hit:!hit)return false;continue;}
    var cmpv;
    if(wcIsNum(e.val)&&wcIsNum(v)){var a1=toNum(v),b1=toNum(e.val);cmpv=a1<b1?-1:(a1>b1?1:0);}
    else{var a2=lc(String(v==null?'':v)),b2=lc(String(e.val));cmpv=a2<b2?-1:(a2>b2?1:0);}
    if(e.op=='='){if(cmpv!==0)return false;}
    else if(e.op=='<>'||e.op=='!='){if(cmpv===0)return false;}
    else if(e.op=='<'){if(!(cmpv<0))return false;}
    else if(e.op=='>'){if(!(cmpv>0))return false;}
    else if(e.op=='<='){if(!(cmpv<=0))return false;}
    else if(e.op=='>='){if(!(cmpv>=0))return false;}
    else return false;
  }
  return true;
}
function xLikeKey(xm,kv){

function aggOf(rows,k){
  if(k===undefined||k===null)k=0;
  var c0=rows._ac;
  if(!c0||rows._acv!==dataVer){c0={};rows._ac=c0;rows._acv=dataVer;}
  var v0=c0[k];
  if(v0!==undefined)return v0;
  v0=aggCalc(rows,k);
  c0[k]=v0;
  return v0;
}
function aggCalc(rows,k){
  if(k===undefined||k===null)k=0;
  var m=_meas[k]||{c:-1,agg:'count'};
  if(m.src){
    var xm=cachedXmap(m.src),keysX=[],seenX={};
    for(var i1=0;i1<rows.length;i1++){
      var L=rows[i1],tt=L.tt||_srcT,rr=L.r;
      if(rr===undefined||!tt)continue;
      var kv=xKeyOf(L,tt,m.src.f,m.src.f2);
      if(m.src.like){var kf=xLikeKey(xm,kv);if(kf===null)continue;kv=kf;}
      if(kv===''||seenX[kv])continue;
      seenX[kv]=1;keysX.push(kv);
    }
    if(m.agg=='count')return keysX.length;
    if(m.agg=='dcount'){var so1={},cc1=0;for(var i2=0;i2<keysX.length;i2++){var vv1=String(xm[keysX[i2]]==null?'':xm[keysX[i2]]);if(!so1[vv1]){so1[vv1]=1;cc1++;}}return cc1;}
    if(m.agg=='avg'){var sa1=0,cn1=0;for(var i3=0;i3<keysX.length;i3++){var va1=xm[keysX[i3]];if(va1==null||va1==='')continue;sa1+=toNum(va1);cn1++;}return cn1?sa1/cn1:0;}
    if(m.agg=='max'){var mx1=null;for(var i4=0;i4<keysX.length;i4++){var vm1=toNum(xm[keysX[i4]]);if(mx1===null||vm1>mx1)mx1=vm1;}return mx1===null?0:mx1;}
    if(m.agg=='min'){var mn1=null;for(var i5=0;i5<keysX.length;i5++){var vn1=toNum(xm[keysX[i5]]);if(mn1===null||vn1<mn1)mn1=vn1;}return mn1===null?0:mn1;}
    var s1=0;for(var i6=0;i6<keysX.length;i6++)s1+=toNum(xm[keysX[i6]]);
    return s1;
  }
  if(m.agg=='count')return rows.length;
  if(m.agg=='dcount'){
    var o={},c=0;
    for(var i=0;i<rows.length;i++){var key=rows[i].dv[k];if(!o[key]){o[key]=1;c++;}}

  }
  if(m.agg=='avg'){
    var sa=0,cn=0;
    for(var ja=0;ja<rows.length;ja++){var va=rows[ja].mv[k];if(va==null)continue;sa+=va;cn++;}
    return cn?sa/cn:0;
  }
  if(m.agg=='max'){
    var mx=null;
    for(var jm=0;jm<rows.length;jm++){var vm=rows[jm].mv[k];if(vm==null)continue;if(mx===null||vm>mx)mx=vm;}
    return mx===null?0:mx;
  }
  if(m.agg=='min'){
    var mn=null;
    for(var jn=0;jn<rows.length;jn++){var vn=rows[jn].mv[k];if(vn==null)continue;if(mn===null||vn<mn)mn=vn;}
    return mn===null?0:mn;
  }
  var s=0;
  for(var j=0;j<rows.length;j++){var vs=rows[j].mv[k];if(vs==null)vs=0;s+=vs;}
  return s;
}

function tcMap(tt,t){
  var mm={},out={};
  for(var q=0;q<tt.cols.length;q++)mm[tt.cols[q]]=q;
  for(var w=0;w<t.cols.length;w++)if(mm[t.cols[w]]!=null)out[w]=mm[t.cols[w]];
  return out;
}
var _cmaps={};
function cmapFor(tt,t){
  if(_cmaps[tt.id]===undefined)_cmaps[tt.id]=(tt===t)?null:tcMap(tt,t);
  return _cmaps[tt.id];
}
function asPath(pj){
  if(pj instanceof Array)return pj;
  try{var a=jparse(pj);if(a instanceof Array)return a;}catch(e){}
  return pj==null?[]:[String(pj)];
}
function drill(pj,cv){
  var path=asPath(pj);
  if(!(path instanceof Array))path=[String(path)];
  var t=findTable(state.cube.src);
  if(!t)return;
  var rp=rowPosArr();
  var cpos=(state.cube.colDim>=0)?state.cube.dims.indexOf(state.cube.colDim):-1;
  var rows=[];
  for(var i=0;i<_leaves.length;i++){
    var L=_leaves[i],ok=true;
    var n=Math.min(rp.length,path.length);
    for(var j=0;j<n;j++)if(L.p[rp[j]]!==path[j]){ok=false;break;}
    if(ok&&cpos>=0&&cv&&L.p[cpos]!==cv)ok=false;
    if(ok)rows.push({row:(L.tt||t).rows[L.r],src:L.src||t.title,tt:L.tt||t});
  }
  var h='<div class="panel"><b>Детализация</b> <span class="small">('+rows.length+' строк)</span><br><br>';
  h+='<div class="cubewrap"><table class="grid"><thead><tr>';
  var _un=(state.cube.union||[]).length>0;
  if(_un)h+='<th>'+tr('Источник')+'</th>';
  for(var c=0;c<t.cols.length;c++)h+='<th>'+esc(t.cols[c])+'</th>';
  h+='</tr></thead>';
  var n2=Math.min(rows.length,50);
  for(var r=0;r<n2;r++){
    h+='<tr>';
    if(_un)h+='<td>'+esc(rows[r].src)+'</td>';
    var rr2=rows[r].row,tt3=rows[r].tt;
    var cc3=cmapFor(tt3,t);
    for(var c2=0;c2<t.cols.length;c2++){
      var vc;
      if(!cc3)vc=rr2[c2];
      else if(cc3[c2]==null)vc='';
      else vc=rr2[cc3[c2]];
      h+='<td>'+drillCell(vc)+'</td>';
    }
    h+='</tr>';
  }
  h+='</table></div>';
  if(rows.length>50)h+='<div class="small">… показаны первые 50 из '+rows.length+'</div>';
  h+='</div>';
  document.getElementById('cDrill').innerHTML=h;fixSticky();
}

function pushDet(newPath,sub,M,F,colVals){
  var t=_srcT;
  if(!t)return;
  var rp=rowPosArr(),skip={};
  for(var d=0;d<rp.length;d++)skip[rp[d]]=1;
  if(state.cube.colDim>=0)skip[state.cube.colDim]=1;
  for(var k=0;k<M;k++){var m=_meas[k];if(m&&!m.src&&m.c>=0)skip[m.c]=1;}
  for(var i2=0;i2<sub.length;i2++){
    var L=sub[i2],tt2=L.tt||t,trow=tt2.rows[L.r]||[];
    var det=[];
    if(L.src)det.push(tr('Источник')+': '+L.src);
    for(var c=0;c<t.cols.length;c++){
      if(skip[c])continue;
      var vv2;
      if(tt2===t)vv2=trow[c];
      else{var cc2=L.cm?L.cm[c]:undefined;vv2=(cc2==null||cc2===undefined)?null:tt2.rows[L.r][cc2];}
      if(vv2!=null&&String(vv2)!=='')det.push(t.cols[c]+': '+vv2);
    }
    var cells=[];
    for(var cA=0;cA<colVals.length;cA++){
      for(var k2=0;k2<M;k2++){
        var m2=_meas[k2],vv='';
        if(m2&&!m2.src){
          if(m2.agg=='count'||m2.agg=='dcount')vv='1';
          else if(L.mv&&L.mv[k2]!=null)vv=fmt(L.mv[k2]);
        }
        cells.push(cA==0?vv:'');
      }
      for(var f=0;f<F;f++)cells.push('');
    }
    for(var k3=0;k3<M;k3++)cells.push('');
    for(var f2=0;f2<F;f2++)cells.push('');
    cells.push(det.join('; '));
    saveRows.push({p:newPath.concat(['\u21b3']),c:cells});
  }
}

function saveCubeTable(){

  if(!state.cube.fx)state.cube.fx=[];

  csvBuf=[];saveRows=[];

    for(var f=0;f<F;f++)hdr.push(String(cv).replace(/;/g,' ')+' - '+String(state.cube.fx[f].name).replace(/;/g,' '));
  }
  for(var k2=0;k2<M;k2++)hdr.push('Итого - '+ml(k2));

  renderRows(_leaves,0,[]);

  for(var gk=0;gk<M;gk++)grv.push(aggOf(_leaves,gk));
  var tots=[];
  for(var c1=0;c1<colVals.length;c1++){
    var sb1=(colVals[c1]==null)?_leaves:filterByCol(_leaves,colVals[c1],colPos);
    var rv1=[];
    for(var m1=0;m1<M;m1++)rv1.push(aggOf(sb1,m1));
    for(var k5=0;k5<M;k5++)tots.push(cellDisp(rv1[k5],k5,rv1,grv,undefined,undefined,rv1,rv1));
    for(var f4=0;f4<F;f4++)tots.push(fmt(fxCell(f4,sb1,rv1)));
  }
  for(var k4=0;k4<M;k4++){var dc2=cellGrand(k4);tots.push(dc2?dc2:fmt(grv[k4]));}

  var cols=['Иерархия'];

  saveRows=null;csvBuf=null;

  for(;;){
    var clash=false;
    for(var q=0;q<state.tables.length;q++)if(state.tables[q].title==nt.title){clash=true;break;}
    if(!clash)break;
    nt.title=base+' ('+n2+')';n2++;

  state.tables.push(nt);saveState();curTable=nt.id;render();
  stat('Свод сохранён как таблицу «'+nt.title+'»: '+rows.length+' строк (иерархия + детали).');

function convStatFrom(st){
  st=String(st==null?'':st);
  if(st=='todo')return 'Активна';
  if(st=='inprogress')return 'В процессе';
  if(st=='done')return 'Готово';
  return '';
}
function convStatTo(st){
  st=String(st==null?'':st);
  if(st=='Активна')return 'todo';
  if(st=='В процессе')return 'inprogress';
  if(st=='Готово')return 'done';
  return '';
}
function convNow(){return new Date().getTime();}
function convFromFile(inp){
  var f=(inp&&inp.files)?inp.files[0]:null;
  if(!f){stat('Файл не выбран.');return;}
  if(!window.FileReader){stat('Не удалось прочитать файл.');return;}
  var fr=new FileReader();
  fr.onload=function(){
    try{convFromSing(String(fr.result));}catch(e){stat('Не удалось прочитать файл.');}
  };
  fr.onerror=function(){stat('Не удалось прочитать файл.');};
  try{fr.readAsText(f,'utf-8');}catch(e){stat('Не удалось прочитать файл.');}
}
function convFromSing(raw){
  dataVer++;
  if(raw==null){stat(tr('Используйте загрузку из файла.'));return;}
  raw=String(raw).replace(/^\uFEFF/,'');
  if(raw.replace(/[ \t\r\n]/g,'')==''){stat(tr('Файл пуст или не выбран.'));return;}
  var obj=null;
  try{obj=jparse(raw);}catch(e){stat('Не удалось разобрать JSON: '+(e&&e.message?e.message:e));return;}
  var arr=null;
  if(obj&&typeof obj=='object'&&obj.notes&&obj.notes.length!=null)arr=obj.notes;
  else if(obj&&typeof obj=='object'&&obj.length!=null)arr=obj;
  if(!arr){stat('В JSON не найден массив notes.');return;}
  var nn=0,nt=0,ti=0,sk=0;
  for(var i=0;i<arr.length;i++){
    var n=arr[i];
    if(!n||typeof n!='object'||n.title==null){sk++;continue;}
    var tags=[];
    var tg=n.tags||[];
    for(var g=0;g<tg.length;g++)if(String(tg[g]).replace(/[ \t]/g,'')!='')tags.push(String(tg[g]));
    var stt=convStatFrom(n.status);
    if(n.isTableNote){
      var cols=[],rows=[];
      var cs=n.columns||[];
      for(var c=0;c<cs.length;c++)cols.push(String(cs[c]==null?'':cs[c]));
      var rs=n.rows||[];
      for(var r=0;r<rs.length;r++){
        var sr=rs[r]||[],dr=[];
        for(var c2=0;c2<cols.length;c2++)dr.push(String(sr[c2]==null?'':sr[c2]));
        rows.push(dr);
      }
      var t={id:uid(),title:String(n.title),cols:cols,rows:rows,tags:tags};
      if(stt)t.tags.push(stt);
      state.tables.push(t);nt++;
    }else{
      var txt='',bl=n.blocks||[];
      for(var b=0;b<bl.length;b++){
        var bb=bl[b]||{},ty=bb.type||'text';
        if(ty=='table'){
          ti++;
          var brs=bb.rows||[];
          if(brs.length){
            var hc=brs[0]||[],tc=[];
            for(var c3=0;c3<hc.length;c3++)tc.push(String(hc[c3]==null?'':hc[c3]));
            var trr=[];
            for(var r2=1;r2<brs.length;r2++){
              var sr2=brs[r2]||[],dr2=[];
              for(var c4=0;c4<tc.length;c4++)dr2.push(String(sr2[c4]==null?'':sr2[c4]));
              trr.push(dr2);
            }
            var ttags=tags.slice(0);
            if(stt)ttags.push(stt);
            state.tables.push({id:uid(),title:String(n.title)+' — таблица '+ti,cols:tc,rows:trr,tags:ttags});
            nt++;
          }
          continue;
        }
        if(ty=='image')continue;
        var chunk='';
        if(ty=='h3')chunk='### '+(bb.text==null?'':bb.text);
        else if(ty=='quote')chunk='> '+(bb.text==null?'':bb.text);
        else if(ty=='code')chunk=String(bb.text==null?'':bb.text).split('\n').join('\n    ');
        else if(ty=='todo')chunk='['+(bb.checked?'x':' ')+'] '+(bb.text==null?'':bb.text);
        else chunk=String(bb.text==null?'':bb.text);
        if(txt)txt+='\n\n';
        txt+=chunk;
      }
      state.notes.push({id:uid(),title:String(n.title),tags:tags,status:stt,text:txt});
      nn++;
    }
  }
  var sq=0,sd=0,so=0;
  if(obj&&typeof obj=='object'&&obj.notes){
    sq=obj.savedQueries&&obj.savedQueries.length?obj.savedQueries.length:0;
    sd=obj.dashboards&&obj.dashboards.length?obj.dashboards.length:0;
    so=obj.olapScenarios&&obj.olapScenarios.length?obj.olapScenarios.length:0;
  }
  saveState();render();
  stat('Импорт из Сингулярности: перенесено заметок '+nn+', таблиц '+nt+', пропущено объектов '+sk+' (запросов '+sq+', дашбордов '+sd+', срезов '+so+').');
}

    if(String(n.text==null?'':n.text)!='')blocks.push({type:'text',text:String(n.text)});
    out.notes.push({id:String(n.id==null?uid():n.id),title:String(n.title==null?'':n.title),blocks:blocks,tags:(n.tags||[]).slice(0),status:convStatTo(n.status),created:convNow(),updated:convNow()});
  }
  for(var t=0;t<state.tables.length;t++){
    var tb=state.tables[t];

    for(var r=0;r<tb.rows.length;r++){
      var sr=tb.rows[r]||[],dr=[];
      for(var c2=0;c2<cols.length;c2++)dr.push(String(sr[c2]==null?'':sr[c2]));

    }
    out.notes.push({id:String(tb.id==null?uid():tb.id),title:String(tb.title==null?'':tb.title),isTableNote:true,columns:cols,rows:rows,noteText:'',tags:(tb.tags||[]).slice(0),status:convStatTo(tb.status),created:convNow(),updated:convNow()});
  }
  var js=jout(out);

  try{
    if(window.Blob&&window.URL&&window.URL.createObjectURL){
      var b=new Blob([js],{type:'application/json'});

      return;
    }
  }catch(e1){}
  try{
    if(window.clipboardData&&window.clipboardData.setData){window.clipboardData.setData('Text',js);stat(tr('JSON в буфере обмена — вставьте в файл ')+fname+tr(' и откройте в Сингулярности через «Импорт».'));return;}
  }catch(e2){}
  stat(tr('Экспорт не поддерживается этим браузером — обновите его.'));
}
function csvCell(v){
  v=String(v==null?'':v);
  if(v.indexOf(';')>=0||v.indexOf(',')>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0)return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function delimChar(d){
  if(d=='tab')return '\t';
  if(d=='sc')return ';';
  if(d=='cm')return ',';
  if(d=='sp')return ' ';
  return '';
}
function parseDelim(text,d){
  var fixed=delimChar(d);
  if(fixed)return fixed;
  var lines=text.split('\n');
  var cnt={'\t':0,';':0,',':0};
  for(var i=0;i<lines.length&&i<50;i++){
    var L=lines[i],inQ=false;
    for(var j=0;j<L.length;j++){
      var c=L.charAt(j);
      if(c=='"')inQ=!inQ;
      else if(!inQ&&cnt[c]!==undefined)cnt[c]++;
    }
  }
  var best='',bv=0,k;
  for(k in cnt)if(cnt[k]>bv){bv=cnt[k];best=k;}
  return best;
}
function splitLine(L,sep){
  var out=[],cur='',inQ=false,j,c;
  for(j=0;j<L.length;j++){
    c=L.charAt(j);
    if(inQ){
      if(c=='"'){
        if(L.charAt(j+1)=='"'){cur+='"';j++;}
        else inQ=false;
      }else cur+=c;
    }else{
      if(c=='"')inQ=true;
      else if(c==sep&&sep!=' '){out.push(cur);cur='';}
      else if(sep==' '&&(c==' '||c=='\t')){
        var j2=j;
        while(j2<L.length&&(L.charAt(j2)==' '||L.charAt(j2)=='\t'))j2++;
        j=j2-1;
        out.push(cur);cur='';
      }
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}
function impPreview(){
  var txt=document.getElementById('iText').value;
  var prev=document.getElementById('iPrev');
  if(!txt.replace(/^[ \t\n\r]+|[ \t\n\r]+$/g,'')){prev.innerHTML='&nbsp;';return;}
  txt=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var sep=parseDelim(txt,document.getElementById('iDelim').value);
  var name=(sep=='\t')?'табуляция':(sep==';'?'точка с запятой':(sep==','?'запятая':(sep==' '?'пробелы':'— не найден —')));
  var lines=txt.split('\n'),cnt=0,i,st=0;
  while(st<lines.length&&lines[st].replace(/^[ \t]+|[ \t]+$/g,'')==='')st++;
  for(i=st;i<lines.length;i++)if(lines[i].replace(/^[ \t]+|[ \t]+$/g,'')!=='')cnt++;
  var h2='Опознан разделитель: <b>'+name+'</b>. Строк данных: <b>'+cnt+'</b>. ';
  if(sep){
    var rows1=splitLine(lines[st],sep);
    h2+=(document.getElementById('iHead').checked?'Заголовки: ':'Первая строка: ')+esc(rows1.join(' | '));
    h2+='<br>Опознано колонок: <b>'+rows1.length+'</b>';
    if(rows1.length<2)h2+=' <span style="color:#a00000">— разделитель, похоже, не подошёл: выберите его вручную из списка (например, «пробел(ы)»).</span>';
  }else{
    h2+='<span style="color:#a00000">Ни табуляции, ни «;», ни «,» не найдено. Выберите разделитель вручную — например, «пробел(ы)», если колонки разделены пробелами.</span>';
  }
  prev.innerHTML=h2;
}
function impDo(){
  dataVer++;
  var txt=document.getElementById('iText').value;
  if(!txt.replace(/^[ \t\n\r]+|[ \t\n\r]+$/g,'')){stat('Нечего импортировать — вставьте данные в поле.');return;}
  txt=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var sep=parseDelim(txt,document.getElementById('iDelim').value);
  if(!sep){stat('Разделитель не опознан — выберите его вручную в списке «Разделитель».');return;}
  var lines=txt.split('\n'),rows=[],i,r,c;
  for(i=0;i<lines.length;i++){
    var L=lines[i];
    if(L.replace(/^[ \t]+|[ \t]+$/g,'')==='')continue;
    rows.push(splitLine(L,sep));
  }
  if(!rows.length){stat('Данных не найдено.');return;}
  var w=0;
  for(r=0;r<rows.length;r++)if(rows[r].length>w)w=rows[r].length;
  var cols,first;
  if(document.getElementById('iHead').checked){
    cols=rows[0].slice(0);first=1;
    while(cols.length<w)cols.push('Колонка '+(cols.length+1));
    for(c=0;c<cols.length;c++){cols[c]=String(cols[c]).replace(/^[ \t]+|[ \t]+$/g,'');if(cols[c]==='')cols[c]='Колонка '+(c+1);}
  }else{
    cols=[];for(c=0;c<w;c++)cols.push('Колонка '+(c+1));
    first=0;
  }
  var data=[];
  for(r=first;r<rows.length;r++){
    var row=rows[r];
    while(row.length<cols.length)row.push('');
    data.push(row.slice(0,cols.length));
  }
  if(!data.length){stat('Строк данных не найдено — только заголовки.');return;}
  var title=document.getElementById('iTitle').value;
  if(!title.replace(/^[ \t]+|[ \t]+$/g,''))title='Импортированная таблица';
  var t={id:uid(),title:title,cols:cols,rows:data};
  state.tables.push(t);
  saveState();
  impPreview();
  stat('Импортировано строк: '+data.length+', колонок: '+cols.length+'. Таблица «'+title+'» создана и доступна в Кубе.');
}

function doRestore(txt){

  var v=null,fixed=0;
  try{v=jparse(txt);}catch(e){v=null;}
  if(!v||v.v!=1||!(v.notes instanceof Array)||!(v.tables instanceof Array)){
    try{v=jparseFix(txt);fixed=1;}catch(e2){v=null;}
    if(!v||v.v!=1||!(v.notes instanceof Array)||!(v.tables instanceof Array)){
      if(!/^[\s]*[{\[]/.test(txt))stat(tr('Это не резервная копия «Сингулярность Классик».'));
      else stat(tr('Копия повреждена и не поддаётся восстановлению.'));
      return;
    }
  }
  state=v;curNote=null;curTable=null;_leaves=[];

function fxRowVals(rows){
  var F=(state.cube.fx&&state.cube.fx.length)?state.cube.fx.length:0;
  var M=_meas.length;
  if(!F||!rows||!rows.length)return null;
  if(rows._rfc&&rows._rfv===dataVer&&rows._rff===F)return rows._rfc;
  var out=[];
  for(var j=0;j<F;j++){
    if(!state.cube.fx[j].rm){out.push(null);continue;}
    var col=new Array(rows.length);
    for(var r=0;r<rows.length;r++){
      var L=rows[r],vals=[];
      for(var m3=0;m3<M;m3++)vals.push(L.mv&&L.mv[m3]!=null?L.mv[m3]:0);
      for(var q=0;q<F;q++)vals.push((out[q]&&out[q][r]!=null&&isFinite(out[q][r]))?out[q][r]:NaN);
      var old=_pvStack;_pvStack=[vals,vals];
      var v;
      try{v=fxCompile(state.cube.fx[j].expr)(vals);}catch(e){v=NaN;}
      _pvStack=old;
      col[r]=v;
    }
    out[j]=col;
  }
  rows._rfc=out;rows._rfv=dataVer;rows._rff=F;
  return out;
}
function fxCell(j,rows,agg){
  var fxj=(state.cube.fx&&state.cube.fx[j])?state.cube.fx[j]:null;
  if(fxj&&fxj.rm){
    var o=fxRowVals(rows);
    if(o&&o[j]){var c=o[j],t=0;for(var i=0;i<c.length;i++){var x=c[i];if(isFinite(x))t+=x;}return t;}
    return NaN;
  }
  return fxSafe(fxj?fxj.expr:'',agg);
}
function fxSafe(expr,vals){
  try{
    var F=(state.cube.fx&&state.cube.fx.length)?state.cube.fx.length:0;
    var M=_meas.length;
    if(vals.length<M+F){
      vals=vals.slice(0);
      while(vals.length<M+F)vals.push(NaN);
      for(var i=0;i<F;i++)vals[M+i]=fxSafe(state.cube.fx[i].expr,vals);
    }
    return fxCompile(expr)(vals);
  }catch(e){return NaN;}
}

    if(!TABLES[key])throw 'SQL: таблица "'+src.table+'" не найдена. Доступны: '+listNames();
    var t=TABLES[key];
    return {cols:t.cols.slice(0),rows:t.rows,alias:src.alias||null,name:src.table};
  }
  function listNames(){ var a=[]; for(var k in TMP)a.push('*'+k); for(var k2 in TABLES)a.push(k2); return a.join(', '); }

  function execStmt(st){
    if(st.k==='select')return execQ(st.q);
    if(st.k==='with'){
      for(var c=0;c<st.ctes.length;c++){
        var ct=st.ctes[c];
        var rr=runQ(ct.q);
        var cols0=(ct.cols?ct.cols.slice(0):rr.cols.slice(0));
        TMP[String(ct.name).toLowerCase()]={title:ct.name,cols:cols0,rows:rr.rows};
      }
      return execQ(st.q);
    }
    if(st.k==='create'){
      var key=String(st.name).toLowerCase();
      if(TMP[key]&&st.ifne)return null;
      if(TMP[key])throw 'SQL: временная таблица "'+st.name+'" уже существует (DROP TABLE IF EXISTS '+st.name+' в начале цепочки)';
      if(st.q){
        var r2=runQ(st.q);
        TMP[key]={title:st.name,cols:(st.cols?st.cols.slice(0):r2.cols.slice(0)),rows:r2.rows};
      } else {
        TMP[key]={title:st.name,cols:(st.cols?st.cols.slice(0):[]),rows:[]};
      }
      return null;
    }
    if(st.k==='drop'){
      var key3=String(st.name).toLowerCase();
      if(TMP[key3]){ delete TMP[key3]; return null; }
      if(st.ife)return null;
      throw 'SQL: таблица "'+st.name+'" не найдена (DROP удаляет только временные таблицы и CTE)';
    }
    if(st.k==='insert'){
      var key4=String(st.name).toLowerCase();
      var tt=TMP[key4];
      if(!tt)throw 'SQL: INSERT разрешён только во временные таблицы (созданные CREATE/WITH в этой же цепочке) — "'+st.name+'" не найдена';
      var srcRows=[];
      if(st.rows){
        for(var ri=0;ri<st.rows.length;ri++){
          var row=st.rows[ri], vals=[];
          for(var ci=0;ci<row.length;ci++){
            var v=evalE(row[ci],{},null);
            vals.push(v===undefined?null:v);
          }
          srcRows.push(vals);
        }
      } else {
        var r3=runQ(st.q);
        srcRows=r3.rows;
      }
      if(!st.cols){
        for(var r4=0;r4<srcRows.length;r4++){
          if(srcRows[r4].length!==tt.cols.length)throw 'SQL: число значений ('+srcRows[r4].length+') не совпадает с числом колонок ('+tt.cols.length+')';
          tt.rows.push(srcRows[r4]);
        }
      } else {
        var idx=[];
        for(var ci2=0;ci2<st.cols.length;ci2++){
          var f=-1;
          for(var c3=0;c3<tt.cols.length;c3++)if(String(tt.cols[c3]).toLowerCase()===String(st.cols[ci2]).toLowerCase())f=c3;
          if(f<0)throw 'SQL: колонка "'+st.cols[ci2]+'" не найдена в таблице "'+st.name+'"';
          idx.push(f);
        }
        for(var r5=0;r5<srcRows.length;r5++){
          var full=[]; for(var c4=0;c4<tt.cols.length;c4++)full.push(null);
          for(var c5=0;c5<idx.length;c5++)full[idx[c5]]=srcRows[r5][c5];
          tt.rows.push(full);
        }
      }
      return null;
    }
    return null;
  }
  function run(sql){
    var tk=tok(sql);
    var pr=P(tk);           // pr={stmts:..., pos:...}
    if(pr.pos<tk.length){ var t=tk[pr.pos]; throw 'SQL: лишний текст после конца запроса (около "'+(t.t==='str'?'"'+t.v+'"':t.v)+'")'; }
    TMP={};
    var last=null;
    for(var si=0;si<pr.stmts.length;si++){
      last=execStmt(pr.stmts[si]);
    }
    return last||{cols:['сообщение'],rows:[['выполнено (нет SELECT в конце цепочки)']]};
  }
  return {run:run,setTables:setTables,fold:fold};
})();

// ==================== вкладка SQL ====================
function sqlTablesFor(){
  var list=[];
  for(var i=0;i<state.tables.length;i++)list.push({title:state.tables[i].title,cols:state.tables[i].cols,rows:state.tables[i].rows});
  return list;
}
function renderSQL(){
  if(!state.sql)state.sql={q:'',err:'',res:null};
  if(state.sql.q===undefined)state.sql.q='';
  var h='<div class="panel"><b>SQL-запрос к таблицам</b>';
  h+='<div class="small">SELECT [DISTINCT] [TOP n] колонки | * FROM таблица [JOIN / LEFT JOIN таблица ON условие] [WHERE] [GROUP BY] [HAVING] [ORDER BY ... [DESC]] [LIMIT n] [UNION ALL SELECT ...]. Подзапросы в FROM: (SELECT ...) AS псевдоним. Функции: SUM COUNT MIN MAX AVG ROUND ABS IIF(условие;да;нет) CASE WHEN FOLD UPPER LOWER TRIM IFNULL COALESCE. Разделитель аргументов — «;» или «,». Имена таблиц/колонок с пробелами — в двойных кавычках или [квадратных скобках]. FOLD(x) — нормализация ключа, как в соединениях куба. Цепочка стейтментов через «;»: WITH имя AS (…) SELECT, CREATE [TEMP] TABLE/VIEW [IF NOT EXISTS] имя AS SELECT, INSERT INTO … SELECT / VALUES, DROP [TABLE|VIEW] [IF EXISTS]; PRAGMA/BEGIN/COMMIT пропускаются. Временные таблицы и CTE живут в рамках одного запуска — вся цепочка должна быть в одном запросе.</div>';
  h+='<div class="small">Таблицы: ';
  for(var i=0;i<state.tables.length;i++){
    h+='<b>'+esc(state.tables[i].title)+'</b> ('+esc(state.tables[i].cols.join(', '))+')'+(i<state.tables.length-1?'; ':'');
  }
  h+='</div>';
  h+='<textarea id="sqlQ" rows="7" style="width:100%">'+esc(state.sql.q)+'</textarea><br>';
  h+='<button class="btn" onclick="sqlDo()">Выполнить</button> <button class="btn" onclick="sqlSave()">Сохранить результат как таблицу</button> ';
  h+='<input id="sqlName" size="24" value="SQL-результат" title="имя новой таблицы">';
  if(state.sql.err)h+='<div style="color:#a00;font-weight:bold">Ошибка: '+esc(state.sql.err)+'</div>';
  if(state.sql.res){
    var r=state.sql.res;
    h+='<div class="small">Строк: '+r.rows.length+'</div><div class="cubewrap"><table class="grid"><tr>';
    for(var c=0;c<r.cols.length;c++)h+='<th>'+esc(r.cols[c])+'</th>';
    h+='</tr>';
    for(var ri=0;ri<r.rows.length&&ri<200;ri++){
      h+='<tr>';
      for(var c2=0;c2<r.cols.length;c2++){
        var v=r.rows[ri][c2];
        h+='<td class="num">'+(v===null||v===undefined?'<i>NULL</i>':esc(String(v)))+'</td>';
      }
      h+='</tr>';
    }
    h+='</table>'+(r.rows.length>200?'<div class="small">показаны первые 200 строк; при сохранении попадут все</div>':'')+'</div>';
  }
  h+='</div>';
  document.getElementById('view7').innerHTML=h;
}
function sqlDo(){
  var q=document.getElementById('sqlQ').value;
  if(!state.sql)state.sql={};
  state.sql.q=q;state.sql.err='';state.sql.res=null;
  try{
    SQLT.setTables(sqlTablesFor());
    state.sql.res=SQLT.run(q);
    stat('SQL: выполнено, строк: '+state.sql.res.rows.length);
  }catch(e){ state.sql.err=String(e); }
  saveState();render();
}
function sqlSave(){
  if(!state.sql||!state.sql.res){stat('SQL: сначала выполните запрос');return;}
  var r=state.sql.res;
  var nm=document.getElementById('sqlName').value||'SQL-результат';
  var rows=[];
  for(var i=0;i<r.rows.length;i++){ var rr=[]; for(var j=0;j<r.rows[i].length;j++)rr.push(r.rows[i][j]); rows.push(rr); }
  state.tables.push({id:'sql'+((new Date()).getTime()),title:nm,cols:r.cols.slice(0),rows:rows});
  saveState();stat('SQL: таблица "'+nm+'" сохранена в раздел «Таблицы»');
  render();
}

</script>
