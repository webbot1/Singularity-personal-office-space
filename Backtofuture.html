// ==================== полифиллы ES3 ====================
if(!Array.prototype.indexOf){Array.prototype.indexOf=function(v){for(var i=0;i<this.length;i++){if(this[i]===v)return i;}return -1;};}
if(!Array.prototype.map){Array.prototype.map=function(f){var r=[];for(var i=0;i<this.length;i++)r.push(f(this[i],i));return r;};}
if(!Array.prototype.filter){Array.prototype.filter=function(f){var r=[];for(var i=0;i<this.length;i++)if(f(this[i],i))r.push(this[i]);return r;};}
if(!Array.prototype.forEach){Array.prototype.forEach=function(f){for(var i=0;i<this.length;i++)f(this[i],i);};}
if(!String.prototype.trim){String.prototype.trim=function(){return this.replace(/^[ \t\n\r]+|[ \t\n\r]+$/g,'');};}

// ==================== сериализация (свой JSON для ES3) ====================
function jstr(s){
  s=String(s);var r='';
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i),cc=s.charCodeAt(i);
    if(c=='"')r+='\\"';
    else if(c=='\\')r+='\\\\';
    else if(cc==10)r+='\\n';
    else if(cc==13)r+='\\r';
    else if(cc==9)r+='\\t';
    else if(cc<32)r+='\\u'+('000'+cc.toString(16)).slice(-4);
    else r+=c;
  }
  return '"'+r+'"';
}
function jout(v){
  if(v===null||v===undefined)return 'null';
  var t=typeof v;
  if(t=='number')return isFinite(v)?String(v):'null';
  if(t=='boolean')return String(v);
  if(t=='string')return jstr(v);
  if(v instanceof Array){
    var a=[];
    for(var i=0;i<v.length;i++)a.push(jout(v[i]));
    return '['+a.join(',')+']';
  }
  var o=[];
  for(var k in v)if(v.hasOwnProperty(k))o.push(jstr(k)+':'+jout(v[k]));
  return '{'+o.join(',')+'}';
}
function jparse(s){
  var i=0;
  function ws(){while(i<s.length&&' \t\n\r'.indexOf(s.charAt(i))>=0)i++;}
  function val(){
    ws();var c=s.charAt(i);
    if(c=='"'){
      i++;var r='';
      while(i<s.length&&s.charAt(i)!=='"'){
        if(s.charAt(i)=='\\'){
          i++;var e=s.charAt(i);
          if(e=='n')r+='\n';
          else if(e=='t')r+='\t';
          else if(e=='r')r+='\r';
          else if(e=='u'){r+=String.fromCharCode(parseInt(s.substr(i+1,4),16));i+=4;}
          else r+=e;
          i++;
        }else{r+=s.charAt(i);i++;}
      }
      i++;return r;
    }
    if(c=='['){
      i++;var a=[];ws();
      if(s.charAt(i)==']'){i++;return a;}
      while(true){a.push(val());ws();if(s.charAt(i)==',')i++;else{i++;break;}}
      return a;
    }
    if(c=='{'){
      i++;var o={};ws();
      if(s.charAt(i)=='}'){i++;return o;}
      while(true){
        ws();var k=val();ws();i++;o[k]=val();ws();
        if(s.charAt(i)==',')i++;else{i++;break;}
      }
      return o;
    }
    if(s.substr(i,4)=='true'){i+=4;return true;}
    if(s.substr(i,5)=='false'){i+=5;return false;}
    if(s.substr(i,4)=='null'){i+=4;return null;}
    var st=i;
    while(i<s.length&&'-0123456789.eE'.indexOf(s.charAt(i))>=0)i++;
    return parseFloat(s.substr(st,i-st));
  }
  return val();
}

// ==================== хранилище: userData (IE5+) с фолбэком на cookie ====================
function storeSave(s){
  try{if(window.localStorage){localStorage.setItem('nbfData',s);return;}}catch(e0){}
  var el=document.getElementById('store');
  try{
    if(el.addBehavior){el.setAttribute('v',s);el.save('nbfStore');return;}
  }catch(e){}
  try{
    if(s.length<3800)document.cookie='nbfData='+encodeURIComponent(s)+';path=/;expires=Thu, 31 Dec 2099 23:59:59 GMT';
  }catch(e2){}
}
function storeLoad(){
  try{if(window.localStorage){var v0=localStorage.getItem('nbfData');if(v0)return v0;}}catch(e0){}
  var el=document.getElementById('store');
  try{
    if(el.addBehavior){el.load('nbfStore');var v=el.getAttribute('v');if(v)return v;}
  }catch(e){}
  try{
    var m=document.cookie.match(/(?:^|; )nbfData=([^;]*)/);
    if(m)return decodeURIComponent(m[1]);
  }catch(e2){}
  return '';
}

// ==================== состояние ====================

function uid(){return 'n'+(new Date().getTime())+Math.floor(Math.random()*1000);}
var _saveT=null;
function saveState(){
  if(_saveT)return;
  _saveT=setTimeout(function(){_saveT=null;try{storeSave(jout(state));}catch(e){}},400);
}
function flushSave(){
  if(_saveT){clearTimeout(_saveT);_saveT=null;try{storeSave(jout(state));}catch(e){}}
}
function loadState(){
  var s=storeLoad();
  if(s){try{var v=jparse(s);if(v&&v.v==1){if(!v.lang)v.lang="ru";return v;}}catch(e){}}
  return null;
}

// ==================== утилиты ====================
function esc(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stat(t){document.getElementById('statusbar').innerHTML=tr(' '+esc(t));}
function fmt(n){
  if(typeof n!='number')return String(n);
  if(isNaN(n)||!isFinite(n))return '\u2014';
  if(Math.abs(n-Math.round(n))<1e-9)return String(Math.round(n)).replace(/(\d)(?=(\d{3})+(?!\d))/g,'$1 ');
  return String(Math.round(n*100)/100);
}
function toNum(v){
  var s=String(v==null?'':v).replace(/ /g,'').replace(/,/g,'.');
  var f=parseFloat(s);
  return isNaN(f)?0:f;
}
function findNote(id){for(var i=0;i<state.notes.length;i++)if(state.notes[i].id==id)return state.notes[i];return null;}
function findTable(id){for(var i=0;i<state.tables.length;i++)if(state.tables[i].id==id)return state.tables[i];return null;}
function noteTitle(id){var n=findNote(id);return n?(n.title||'(без названия)'):'(удалена)';}

var TRIZEN=[['Divide and conquer','Split the object into independent parts; make the parts removable; increase the degree of fragmentation'],

['Local quality','Give each part of the object its own conditions; let every part work in its best mode'],

['Merging','Combine similar or adjacent objects; merge operations in time'],
['Universality','One object does several different jobs; other objects become unnecessary'],
['Nested doll','One object is placed inside another, inside that — the next one'],

['Preliminary anti-action','Preliminary stress in advance to oppose the working stress'],
['Preliminary action','Perform the needed action in advance, fully or at least partially'],
['Cushion in advance','Prepare emergency measures and compensations in advance against a mishap'],
['Equipotentiality','Change working conditions so the object does not have to be raised or lowered'],
['The other way around','Do it the other way around; make the immovable movable; turn the object inside out'],
['Spheroidality','Go from straight lines to curves, from cubes to spheres; use rollers and balls'],
['Dynamics','Change the characteristics of the object at each stage of work; split it into movable parts'],
['Partial or excessive actions','Do it not 100%, but a bit less or a bit more — the task will get simpler'],

['Continuity of useful action','Carry out the work without interruptions; eliminate idle running'],

var DICTP=null,DICTVP=null;
function dictReady(){
  if(!DICTP){DICTP=[];for(var k in DICT)DICTP.push([k,DICT[k]]);DICTP.sort(function(a,b){return b[0].length-a[0].length;});}
  if(!DICTVP){DICTVP=[];for(var k2 in DV)DICTVP.push([k2,DV[k2]]);DICTVP.sort(function(a,b){return b[0].length-a[0].length;});}
}
function LANG(){return (state&&state.lang)?state.lang:'ru';}
function tr(s){
  if(LANG()!='en')return s;
  dictReady();
  for(var i=0;i<DICTP.length;i++){var k=DICTP[i][0];if(s.indexOf(k)>=0)s=s.split(k).join(DICTP[i][1]);}
  return s;
}
function Ts(s){
  s=String(s==null?'':s);
  if(LANG()!='en')return s;
  dictReady();
  for(var i=0;i<DICTVP.length;i++){var k=DICTVP[i][0];if(s==k)return DV[k];}
  return s;
}
function Tc(s){return Ts(s)?Ts(s):s;}

function keyOf(path,lvl){return path.join('\u0001')+'|'+lvl;}
function distinctVals(leaves,pos){
  var o=[],seen={};
  for(var i=0;i<leaves.length;i++){
    var v=String(leaves[i].p[pos]);
    if(!seen[v]){seen[v]=1;o.push(v);}
  }
  o.sort();
  return o;
}
function starLinks(){if(!state.cube.links)state.cube.links={};return state.cube.links;}
function starMaps(t){
  var L=starLinks(),maps={};
  for(var k in L){
    if(!L.hasOwnProperty(k))continue;
    var l=L[k],dt=findTable(l.dim);
    if(!dt||l.dkey<0||l.attr<0)continue;
    var m={};
    for(var i=0;i<dt.rows.length;i++){
      var kk=String(dt.rows[i][l.dkey]==null?'':dt.rows[i][l.dkey]);
      var av=String(dt.rows[i][l.attr]==null?'':dt.rows[i][l.attr]);
      if(kk!=='')m[kk]=av;
    }
    maps[k]=m;
  }
  return maps;
}
function dimLabel(t,d){
  var L=starLinks()[d];
  if(L){var dt=findTable(L.dim);
    if(dt&&L.attr>=0&&dt.cols[L.attr]!=null)return dt.cols[L.attr]+' ← '+dt.title;}
  return t&&t.cols[d]!=null?t.cols[d]:'?';
}
function dimDistinct(t,di){
  var m=starMaps(t)[di];
  if(!m)return distinctCols(t,di);
  var o=[],seen={};
  for(var i=0;i<t.rows.length;i++){
    var v0=String(t.rows[i][di]==null?'':t.rows[i][di]);
    var v=m[v0]||v0;
    if(!seen[v]){seen[v]=1;o.push(v);}
  }
  o.sort();return o;
}
function makeLeaves(t){
  var dims=state.cube.dims,f=state.cube.filters,sm=starMaps(t),out=[];
  for(var i=0;i<t.rows.length;i++){
    var r=t.rows[i],ok=true,path=[],mv=[],dv=[];
    for(var j=0;j<dims.length;j++){
      var v0=String(r[dims[j]]==null?'':r[dims[j]]);
      var v=sm[dims[j]]?(sm[dims[j]][v0]||v0):v0;
      if(f[dims[j]]&&f[dims[j]]!=v){ok=false;break;}
      path.push(v);
    }
    if(!ok)continue;
    for(var k=0;k<_meas.length;k++){
      var col=_meas[k].c;
      mv.push(_meas[k].agg=='count'?1:toNum(r[col]));
      dv.push(String(r[col]==null?'':r[col]));
    }
    out.push({p:path,mv:mv,dv:dv,r:i});
  }
  return out;
}

function aggOf(rows,k){
  if(k===undefined||k===null)k=0;
  var m=_meas[k]||{c:-1,agg:'count'};
  if(m.src){
    var xm=_XMAP[m.src.t]||{},kf=m.src.f,keysX=[],seenX={};
    for(var i1=0;i1<rows.length;i1++){
      var rr=rows[i1].r;
      if(rr===undefined||!_srcT)continue;
      var kv=String(_srcT.rows[rr][kf]==null?'':_srcT.rows[rr][kf]);
      if(kv===''||seenX[kv])continue;
      seenX[kv]=1;keysX.push(kv);
    }
    if(m.agg=='count')return keysX.length;
    if(m.agg=='dcount'){var so1={},cc1=0;for(var i2=0;i2<keysX.length;i2++){var vv1=String(xm[keysX[i2]]==null?'':xm[keysX[i2]]);if(!so1[vv1]){so1[vv1]=1;cc1++;}}return cc1;}
    if(m.agg=='avg'){var sa1=0;for(var i3=0;i3<keysX.length;i3++)sa1+=toNum(xm[keysX[i3]]);return keysX.length?sa1/keysX.length:0;}
    if(m.agg=='max'){var mx1=null;for(var i4=0;i4<keysX.length;i4++){var vm1=toNum(xm[keysX[i4]]);if(mx1===null||vm1>mx1)mx1=vm1;}return mx1===null?0:mx1;}
    if(m.agg=='min'){var mn1=null;for(var i5=0;i5<keysX.length;i5++){var vn1=toNum(xm[keysX[i5]]);if(mn1===null||vn1<mn1)mn1=vn1;}return mn1===null?0:mn1;}
    var s1=0;for(var i6=0;i6<keysX.length;i6++)s1+=toNum(xm[keysX[i6]]);
    return s1;
  }
  if(m.agg=='count')return rows.length;
  if(m.agg=='dcount'){
    var o={},c=0;
    for(var i=0;i<rows.length;i++){var key=rows[i].dv[k];if(!o[key]){o[key]=1;c++;}}
    return c;
  }
  if(m.agg=='avg'){
    var sa=0;
    for(var ja=0;ja<rows.length;ja++)sa+=rows[ja].mv[k];
    return rows.length?sa/rows.length:0;
  }
  if(m.agg=='max'){
    var mx=null;
    for(var jm=0;jm<rows.length;jm++){var vm=rows[jm].mv[k];if(mx===null||vm>mx)mx=vm;}
    return mx===null?0:mx;
  }
  if(m.agg=='min'){
    var mn=null;
    for(var jn=0;jn<rows.length;jn++){var vn=rows[jn].mv[k];if(mn===null||vn<mn)mn=vn;}
    return mn===null?0:mn;
  }
  var s=0;
  for(var j=0;j<rows.length;j++)s+=rows[j].mv[k];
  return s;
}

function groupBy(rows,pos){
  var m={},order=[];
  for(var i=0;i<rows.length;i++){
    var k=String(rows[i].p[pos]);
    if(!m[k]){m[k]=[];order.push(k);}
    m[k].push(rows[i]);
  }
  return {m:m,order:order};
}
function filterByCol(sub,v,pos){
  var r=[];
  for(var i=0;i<sub.length;i++)if(String(sub[i].p[pos])==v)r.push(sub[i]);
  return r;
}
function renderRows(leaves,lvl,path){
  var rp=rowPosArr();
  if(lvl>=rp.length)return '';
  var pos=rp[lvl];
  var g=groupBy(leaves,pos);
  var order=g.order;
  var M=_meas.length;
  var F=(state.cube.fx&&state.cube.fx.length)?state.cube.fx.length:0;
  var top=parseInt(state.cube.top,10)||0;
  if(lvl==0&&top>0){
    order.sort(function(a,b){return aggOf(g.m[b],0)-aggOf(g.m[a],0);});
    if(order.length>top){
      var rest=order.slice(top),rl=[];
      for(var q=0;q<rest.length;q++)rl=rl.concat(g.m[rest[q]]);
      order=order.slice(0,top);
      g.m['\u2026 Прочие']=rl;
      order.push('\u2026 Прочие');
    }
  }else if(state.cube.sort=='val'){
    order.sort(function(a,b){return aggOf(g.m[b],0)-aggOf(g.m[a],0);});
  }else{
    order.sort();
  }
  var colPos=(state.cube.colDim>=0)?state.cube.dims.indexOf(state.cube.colDim):-1;
  var colVals=(colPos>=0)?distinctVals(_leaves,colPos):[null];
  var grand=[];
  for(var g1=0;g1<M;g1++)grand.push(aggOf(_leaves,g1));
  var colTot=[];
  for(var c0=0;c0<colVals.length;c0++){
    var sb0=(colVals[c0]==null)?_leaves:filterByCol(_leaves,colVals[c0],colPos);
    var aa=[];
    for(var m0=0;m0<M;m0++)aa.push(aggOf(sb0,m0));
    colTot.push(aa);
  }
  var rank={};
  for(var c1=0;c1<colVals.length;c1++)for(var m1=0;m1<M;m1++){
    var arr=[];
    for(var r1=0;r1<order.length;r1++){
      var sb1=g.m[order[r1]];
      var sb2=(colVals[c1]==null)?sb1:filterByCol(sb1,colVals[c1],colPos);
      arr.push(aggOf(sb2,m1));
    }
    for(var r2=0;r2<arr.length;r2++){
      var rk=1;
      for(var r3=0;r3<arr.length;r3++)if(arr[r3]>arr[r2])rk++;
      rank[c1+'_'+m1+'_'+r2]=rk;
    }
  }
  var run={};
  var h='';
  for(var i=0;i<order.length;i++){
    var k=order[i],sub=g.m[k];
    var isOther=(k=='\u2026 Прочие');
    var newPath=path.concat([k]);
    var collapsible=(lvl<rp.length-1)&&!isOther;
    var lab;
    if(isOther)lab=esc(k);
    else lab='<span class="lnk" onclick="drill('+esc(jout(newPath))+',null)">'+esc(k)+'</span>';
    if(collapsible){
      var collapsed=!!state.cube.collapsed[keyOf(newPath,lvl)];
      lab='<span class="lnk" onclick="toggleNode('+esc(jout(newPath))+','+lvl+')">'+(collapsed?'+':'-')+'</span> '+lab;
    }
    h+='<tr><td style="padding-left:'+(lvl*16)+'px">'+lab+'</td>';
    var rowVals=[],rowTot=[];
    for(var m2=0;m2<M;m2++)rowTot.push(aggOf(sub,m2));
    for(var cA=0;cA<colVals.length;cA++){
      var sbA=(colVals[cA]==null)?sub:filterByCol(sub,colVals[cA],colPos);
      var aA=[];
      for(var mA=0;mA<M;mA++){
        var rv=aggOf(sbA,mA);
        aA.push(rv);
        var rk2=cA+'_'+mA;
        run[rk2]=(run[rk2]||0)+rv;
      }
      rowVals.push(aA);
    }
    for(var c=0;c<colVals.length;c++){
      var sub2=(colVals[c]==null)?sub:filterByCol(sub,colVals[c],colPos);
      for(var m3=0;m3<M;m3++){
        var v=rowVals[c][m3];
        var disp=cellDisp(v,m3,colTot[c],grand,rank[c+'_'+m3+'_'+i],run[c+'_'+m3],rowVals[c],rowTot);
        h+='<td class="num"><span class="lnk" onclick="drill('+esc(jout(newPath))+','+esc(jout(colVals[c]==null?'':colVals[c]))+')">'+negRed(disp,rv)+'</span></td>';
      }
      for(var f1=0;f1<F;f1++){
        var fv=fxSafe(state.cube.fx[f1].expr,rowVals[c]);
        h+='<td class="num"><span class="lnk" onclick="drill('+esc(jout(newPath))+','+esc(jout(colVals[c]==null?'':colVals[c]))+')">'+negRed(fmt(fv),fv)+'</span></td>';
      }
    }
    for(var m4=0;m4<M;m4++)h+='<td class="num"><b>'+negRed(totDisp(m4,rowTot),rowTot[m4])+'</b></td>';
    for(var f2=0;f2<F;f2++){var fvt=fxSafe(state.cube.fx[f2].expr,rowTot);h+='<td class="num"><b>'+negRed(fmt(fvt),fvt)+'</b></td>';}
    h+='</tr>';
    if(csvBuf){
      var cells=[];
      for(var c5=0;c5<colVals.length;c5++){
        var sb3=(colVals[c5]==null)?sub:filterByCol(sub,colVals[c5],colPos);
        var rv3=[];
        for(var m6=0;m6<M;m6++)rv3.push(aggOf(sb3,m6));
        for(var m7=0;m7<M;m7++)cells.push(cellDisp(rv3[m7],m7,colTot[c5],grand,rank[c5+'_'+m7+'_'+i],run[c5+'_'+m7],rv3,rowTot));
        for(var f4=0;f4<F;f4++)cells.push(fmt(fxSafe(state.cube.fx[f4].expr,rv3)));
      }
      for(var m8=0;m8<M;m8++)cells.push(totDisp(m8,rowTot));
      for(var f5=0;f5<F;f5++)cells.push(fmt(fxSafe(state.cube.fx[f5].expr,rowTot)));
      csvBuf.push(newPath.join(' / ')+';'+cells.join(';'));
    }
    if(saveRows){
      saveRows.push({p:newPath,c:cells.slice(0)});
      if((lvl>=rp.length-1)||state.cube.collapsed[keyOf(newPath,lvl)])pushDet(newPath,sub,M,F,colVals);
    }
    if(collapsible&&!state.cube.collapsed[keyOf(newPath,lvl)])h+=renderRows(sub,lvl+1,newPath);
  }
  return h;
}

function distinctCols(t,ci){
  var o=[],seen={};
  for(var i=0;i<t.rows.length;i++){
    var v=String(t.rows[i][ci]==null?'':t.rows[i][ci]);
    if(!seen[v]){seen[v]=1;o.push(v);}
  }
  o.sort();
  return o;
}
function cubeSet(){
  var ns=document.getElementById('cSrc').value;
  var t=findTable(ns);
  if(!t){stat('Выберите таблицу-источник.');return;}
  if(ns!=state.cube.src){
    state.cube.src=ns;
    state.cube.dims=[];state.cube.measures=[];state.cube.measure=-1;state.cube.agg='sum';state.cube.colDim=-1;
    state.cube.filters={};state.cube.collapsed={};state.cube.links={};
    saveState();
    renderCube();
    build();
    stat('Источник: «'+t.title+'». Отметьте измерения и нажмите «Построить».');
    return;
  }
  var cd=parseInt(document.getElementById('cCol').value,10);
  state.cube.colDim=(state.cube.dims.indexOf(cd)>=0)?cd:-1;
  state.cube.top=parseInt(document.getElementById('cTop').value,10)||0;
  state.cube.sort=document.getElementById('cSort').value;
  state.cube.collapsed={};
  saveState();
  renderCube();
  build();
}

function toggleDim(d,on){
  if(on){
    if(state.cube.dims.indexOf(d)<0)state.cube.dims.push(d);
  }else{
    var ix=state.cube.dims.indexOf(d);
    if(ix>=0)state.cube.dims.splice(ix,1);
    if(state.cube.colDim==d)state.cube.colDim=-1;
  }
  state.cube.collapsed={};
  saveState();
  renderCube();
  build();
}
function cubeSetFilter(d,v){
  if(v)state.cube.filters[d]=v;
  else delete state.cube.filters[d];
  saveState();build();
}
function starSet(d,field,val){
  var L=starLinks();
  if(!L[d])L[d]={dim:'',dkey:-1,attr:-1};
  if(field=='dim'){L[d].dim=val;L[d].dkey=-1;L[d].attr=-1;}
  else L[d][field]=(val===''?-1:parseInt(val,10));
  state.cube.collapsed={};saveState();renderCube();build();

function asPath(pj){
  if(pj instanceof Array)return pj;
  try{var a=jparse(pj);if(a instanceof Array)return a;}catch(e){}
  return pj==null?[]:[String(pj)];
}
function drill(pj,cv){
  var path=asPath(pj);
  if(!(path instanceof Array))path=[String(path)];
  var t=findTable(state.cube.src);
  if(!t)return;
  var rp=rowPosArr();
  var cpos=(state.cube.colDim>=0)?state.cube.dims.indexOf(state.cube.colDim):-1;
  var rows=[];
  for(var i=0;i<_leaves.length;i++){
    var L=_leaves[i],ok=true;
    var n=Math.min(rp.length,path.length);
    for(var j=0;j<n;j++)if(L.p[rp[j]]!==path[j]){ok=false;break;}
    if(ok&&cpos>=0&&cv&&L.p[cpos]!==cv)ok=false;
    if(ok)rows.push(t.rows[L.r]);
  }
  var h='<div class="panel"><b>Детализация</b> <span class="small">('+rows.length+' строк)</span><br><br>';

  h+='</tr></thead>';
  var n2=Math.min(rows.length,50);
  for(var r=0;r<n2;r++){
    h+='<tr>';
    for(var c2=0;c2<t.cols.length;c2++)h+='<td>'+drillCell(rows[r][c2])+'</td>';
    h+='</tr>';
  }
  h+='</table></div>';

}

function pushDet(newPath,sub,M,F,colVals){
  var t=_srcT;
  if(!t)return;
  var rp=rowPosArr(),skip={};
  for(var d=0;d<rp.length;d++)skip[rp[d]]=1;
  if(state.cube.colDim>=0)skip[state.cube.colDim]=1;
  for(var k=0;k<M;k++){var m=_meas[k];if(m&&!m.src&&m.c>=0)skip[m.c]=1;}
  for(var i2=0;i2<sub.length;i2++){
    var L=sub[i2],trow=t.rows[L.r]||[];
    var det=[];
    for(var c=0;c<t.cols.length;c++){
      if(!skip[c]&&trow[c]!=null&&String(trow[c])!=='')det.push(t.cols[c]+': '+trow[c]);
    }
    var cells=[];
    for(var cA=0;cA<colVals.length;cA++){
      for(var k2=0;k2<M;k2++){
        var m2=_meas[k2],vv='';
        if(m2&&!m2.src){
          if(m2.agg=='count'||m2.agg=='dcount')vv='1';
          else if(L.mv&&L.mv[k2]!=null)vv=fmt(L.mv[k2]);
        }
        cells.push(cA==0?vv:'');
      }
      for(var f=0;f<F;f++)cells.push('');
    }
    for(var k3=0;k3<M;k3++)cells.push('');
    for(var f2=0;f2<F;f2++)cells.push('');
    cells.push(det.join('; '));
    saveRows.push({p:newPath.concat(['\u21b3']),c:cells});
  }
}

function csvCell(v){
  v=String(v==null?'':v);
  if(v.indexOf(';')>=0||v.indexOf(',')>=0||v.indexOf('"')>=0||v.indexOf('\n')>=0)return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function delimChar(d){
  if(d=='tab')return '\t';
  if(d=='sc')return ';';
  if(d=='cm')return ',';
  if(d=='sp')return ' ';
  return '';
}
function parseDelim(text,d){
  var fixed=delimChar(d);
  if(fixed)return fixed;
  var lines=text.split('\n');
  var cnt={'\t':0,';':0,',':0};
  for(var i=0;i<lines.length&&i<50;i++){
    var L=lines[i],inQ=false;
    for(var j=0;j<L.length;j++){
      var c=L.charAt(j);
      if(c=='"')inQ=!inQ;
      else if(!inQ&&cnt[c]!==undefined)cnt[c]++;
    }
  }
  var best='',bv=0,k;
  for(k in cnt)if(cnt[k]>bv){bv=cnt[k];best=k;}
  return best;
}
function splitLine(L,sep){
  var out=[],cur='',inQ=false,j,c;
  for(j=0;j<L.length;j++){
    c=L.charAt(j);
    if(inQ){
      if(c=='"'){
        if(L.charAt(j+1)=='"'){cur+='"';j++;}
        else inQ=false;
      }else cur+=c;
    }else{
      if(c=='"')inQ=true;
      else if(c==sep&&sep!=' '){out.push(cur);cur='';}
      else if(sep==' '&&(c==' '||c=='\t')){
        var j2=j;
        while(j2<L.length&&(L.charAt(j2)==' '||L.charAt(j2)=='\t'))j2++;
        j=j2-1;
        out.push(cur);cur='';
      }
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}
function impPreview(){
  var txt=document.getElementById('iText').value;
  var prev=document.getElementById('iPrev');
  if(!txt.replace(/^[ \t\n\r]+|[ \t\n\r]+$/g,'')){prev.innerHTML='&nbsp;';return;}
  txt=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var sep=parseDelim(txt,document.getElementById('iDelim').value);
  var name=(sep=='\t')?'табуляция':(sep==';'?'точка с запятой':(sep==','?'запятая':(sep==' '?'пробелы':'— не найден —')));
  var lines=txt.split('\n'),cnt=0,i,st=0;
  while(st<lines.length&&lines[st].replace(/^[ \t]+|[ \t]+$/g,'')==='')st++;
  for(i=st;i<lines.length;i++)if(lines[i].replace(/^[ \t]+|[ \t]+$/g,'')!=='')cnt++;

  }else{

  }

}
function impDo(){
  var txt=document.getElementById('iText').value;
  if(!txt.replace(/^[ \t\n\r]+|[ \t\n\r]+$/g,'')){stat('Нечего импортировать — вставьте данные в поле.');return;}
  txt=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var sep=parseDelim(txt,document.getElementById('iDelim').value);
  if(!sep){stat('Разделитель не опознан — выберите его вручную в списке «Разделитель».');return;}
  var lines=txt.split('\n'),rows=[],i,r,c;
  for(i=0;i<lines.length;i++){
    var L=lines[i];
    if(L.replace(/^[ \t]+|[ \t]+$/g,'')==='')continue;
    rows.push(splitLine(L,sep));
  }
  if(!rows.length){stat('Данных не найдено.');return;}
  var w=0;
  for(r=0;r<rows.length;r++)if(rows[r].length>w)w=rows[r].length;
  var cols,first;
  if(document.getElementById('iHead').checked){
    cols=rows[0].slice(0);first=1;
    while(cols.length<w)cols.push('Колонка '+(cols.length+1));
    for(c=0;c<cols.length;c++){cols[c]=String(cols[c]).replace(/^[ \t]+|[ \t]+$/g,'');if(cols[c]==='')cols[c]='Колонка '+(c+1);}
  }else{
    cols=[];for(c=0;c<w;c++)cols.push('Колонка '+(c+1));
    first=0;
  }
  var data=[];
  for(r=first;r<rows.length;r++){
    var row=rows[r];
    while(row.length<cols.length)row.push('');
    data.push(row.slice(0,cols.length));
  }
  if(!data.length){stat('Строк данных не найдено — только заголовки.');return;}
  var title=document.getElementById('iTitle').value;
  if(!title.replace(/^[ \t]+|[ \t]+$/g,''))title='Импортированная таблица';
  var t={id:uid(),title:title,cols:cols,rows:data};
  state.tables.push(t);
  saveState();
  impPreview();
  stat('Импортировано строк: '+data.length+', колонок: '+cols.length+'. Таблица «'+title+'» создана и доступна в Кубе.');
}
function expTable(){

function lc(s){
  s=String(s);
  var up='\u0410\u0411\u0412\u0413\u0414\u0415\u0401\u0416\u0417\u0418\u0419\u041a\u041b\u041c\u041d\u041e\u041f\u0420\u0421\u0422\u0423\u0424\u0425\u0426\u0427\u0428\u0429\u042a\u042b\u042c\u042d\u042e\u042f';
  var lo='\u0430\u0431\u0432\u0433\u0434\u0435\u0451\u0436\u0437\u0438\u0439\u043a\u043b\u043c\u043d\u043e\u043f\u0440\u0441\u0442\u0443\u0444\u0445\u0446\u0447\u0448\u0449\u044a\u044b\u044c\u044d\u044e\u044f';
  var r='';
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i),ix=up.indexOf(c);
    r+=(ix>=0)?lo.charAt(ix):((c>='A'&&c<='Z')?String.fromCharCode(c.charCodeAt(0)+32):c);
  }
  return r;
}

function measuresOf(){

    var out=[];
    for(var i=0;i<ms.length;i++)if(ms[i]&&ms[i].c!==undefined)out.push({c:ms[i].c,agg:ms[i].agg||'sum',show:ms[i].show||'val',src:ms[i].src||null});
    return out;
  }

function measLabel(m,t){

function pctStr(v,d){
  if(d===null||d===undefined||!isFinite(d)||d===0)return '\u2014';
  return fmt(Math.round(v/d*10000)/100)+'%';
}
function negRed(s,n){
  if(typeof n=='number'&&isFinite(n)&&n<0)return '<span style="color:#c00000">'+s+'</span>';
  return s;
}
function drillCell(v){
  var s=String(v==null?'':v);
  if(s.length){var f=parseFloat(s.replace(',','.'));if(isFinite(f)&&f<0)return '<span style="color:#c00000">'+esc(s)+'</span>';}
  return esc(s);
}
function fxSafe(expr,vals){
  try{return fxEval(expr,vals);}catch(e){return NaN;}
}
function cellDisp(v,mi,ct,gr,rk,rn,rvArr,rt){
  var show=(_meas[mi]&&_meas[mi].show)?_meas[mi].show:'val';
  if(show=='pct')return pctStr(v,gr&&gr[mi]!==undefined?gr[mi]:NaN);
  if(show=='rowpct')return pctStr(v,rt&&rt[mi]!==undefined?rt[mi]:NaN);
  if(show=='colpct')return pctStr(v,ct&&ct[mi]!==undefined?ct[mi]:NaN);
  if(show=='rank')return (rk===undefined||rk===null)?'\u2014':String(rk);
  if(show=='run')return (rn===undefined||rn===null)?'\u2014':fmt(rn);

}

}

function fxAdd(){
  if(!state.cube.fx)state.cube.fx=[];
  var nm=document.getElementById('fxName'),ex=document.getElementById('fxExpr');
  if(!nm||!ex)return;
  var name=nm.value.replace(/^\s+|\s+$/g,''),expr=ex.value.replace(/^\s+|\s+$/g,'');
  if(!expr){stat('Введите формулу, например m1-m2.');return;}
  if(!name)name='Формула '+(state.cube.fx.length+1);
  if(!fxCheck(expr)){stat('Формула не распознана: разрешены числа, m1...mN, + - * / и скобки.');return;}
  state.cube.fx.push({name:name,expr:expr});
  saveState();renderCube();build();
}

  if(!state.cube.fx)return;
  state.cube.fx.splice(i,1);
  saveState();renderCube();build();
}
function fxCheck(s){
  var ms=measuresOf(),n=ms.length;if(n<1)n=1;
  var a=[];for(var i=0;i<n;i++)a.push(1);
  try{fxEval(s,a);return true;}catch(e){return false;}
}
function fxEval(expr,vals){
  var s=String(expr),i=0;
  function ws(){while(i<s.length&&(s.charAt(i)==' '||s.charAt(i)=='\t'))i++;}
  function prim(){
    ws();
    var c=s.charAt(i);
    if(c=='('){
      i++;
      var v=add();
      ws();
      if(s.charAt(i)!=')')throw new Error('br');
      i++;
      return v;
    }
    if(c=='-'){i++;return -prim();}
    if(c>='0'&&c<='9'){
      var st=i;
      while(i<s.length&&'0123456789.'.indexOf(s.charAt(i))>=0)i++;
      var f=parseFloat(s.substr(st,i-st));
      if(isNaN(f))throw new Error('num');
      return f;
    }
    if(c=='m'||c=='M'){
      i++;
      var st2=i;
      while(i<s.length&&s.charAt(i)>='0'&&s.charAt(i)<='9')i++;
      if(i==st2)throw new Error('ref');
      var n=parseInt(s.substr(st2,i-st2),10);
      if(!(n>=1&&n<=vals.length))throw new Error('rng');
      return vals[n-1];
    }
    throw new Error('tk');
  }
  function mul(){
    var v=prim();
    while(true){
      ws();
      var c=s.charAt(i);
      if(c=='*'){i++;v=v*prim();}
      else if(c=='/'){i++;var d=prim();v=(d===0)?NaN:v/d;}
      else break;
    }
    return v;
  }
  function add(){
    var v=mul();
    while(true){
      ws();
      var c=s.charAt(i);
      if(c=='+'){i++;v=v+mul();}
      else if(c=='-'){i++;v=v-mul();}
      else break;
    }
    return v;
  }
  var r=add();
  ws();
  if(i<s.length)throw new Error('tail');
  return r;
}

function fixSticky(){

  for(var i=0;i<ths.length;i++){
    if(!ths[i].offsetParent)continue;
    var rows=ths[i].getElementsByTagName('tr'),acc=0;
    for(var r=0;r<rows.length;r++){
      var th=rows[r].getElementsByTagName('th');
      for(var j=0;j<th.length;j++)th[j].style.top=acc+'px';
      if(rows[r].offsetHeight)acc+=rows[r].offsetHeight;
    }
  }
}
